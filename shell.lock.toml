# Lock screen password field: a translucent card with HUD side rails.
# Thin top and bottom edges, thick left and right rails; the rails light up while typing.
background       = "#0b0604"
background-alpha = 0.72
text             = "#f3dcc8"
placeholder      = "#8b7c70"
text-error       = "#ff5a4e"
border           = "#79441c"
border-active    = "#ff8f3a"
border-error     = "#ff5a4e"
border-alpha     = 1.0
border-width     = "1 3"
selection        = "#ff8f3a"
selection-alpha  = 0.4
